# =============================================================================
# Dependabot – Automated Dependency Updates
# =============================================================================
# Keeps GitHub Actions and npm dependencies up to date.
# Schedule: weekly on Sunday at 13:30 UTC.
# =============================================================================

version: 2
updates:
  # ---------------------------------------------------------------------------
  # GitHub Actions
  # ---------------------------------------------------------------------------
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "13:30"
      timezone: "Etc/UTC"
    commit-message:
      prefix: "chore(ci)"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      github-actions:
        patterns:
          - "*"

  # ---------------------------------------------------------------------------
  # npm (VitePress + dev tooling)
  # ---------------------------------------------------------------------------
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "13:30"
      timezone: "Etc/UTC"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "npm"
    # Groups split by update type, so they never overlap:
    # - npm-minor-and-patch: every minor and patch update in one PR per
    #   run, merged by dependabot-maintenance.yml once nodejs-pr.yml passed.
    #   0.x packages are excluded and keep their own PRs: a 0.y minor
    #   counts as major for the auto-merge gate and would hold the whole
    #   group open.
    # - vitepress, dev-tooling (update-types major):
    #   majors of these packages stay in one PR per group, open for review.
    groups:
      npm-minor-and-patch:
        patterns:
          - "*"
        exclude-patterns:
          - "markdownlint-cli2"
          - "sharp"
          - "vitepress-plugin-rss"
        update-types:
          - "minor"
          - "patch"
      vitepress:
        patterns:
          - "vitepress"
        update-types:
          - "major"
      dev-tooling:
        patterns:
          - "markdownlint-cli2"
          - "linkinator"
          - "rimraf"
          - "husky"
          - "lint-staged"
        update-types:
          - "major"
